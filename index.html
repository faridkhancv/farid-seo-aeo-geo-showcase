let activeCat = 'all';
let searchQuery = '';

function init(){
  buildChips();
  render();

  document.getElementById('search').addEventListener('input', (e)=>{
    searchQuery = e.target.value.toLowerCase().trim();
    render();
  });
}

function buildChips(){
  const container = document.getElementById('chips');
  let html = `<div class="chip ${activeCat==='all'?'active':''}" data-cat="all" style="--cat-color:var(--text)">
    <span class="swatch"></span> All Issues
  </div>`;

  categories.forEach(c => {
    html += `<div class="chip ${activeCat===c.id?'active':''}" data-cat="${c.id}" style="--cat-color:${c.color}">
      <span class="swatch"></span> ${c.name}
    </div>`;
  });

  container.innerHTML = html;

  container.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', ()=>{
      activeCat = el.getAttribute('data-cat');
      document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      el.classList.add('active');
      render();
    });
  });
}

function render(){
  const main = document.getElementById('main');
  const noRes = document.getElementById('noResults');
  
  let filtered = issues.filter(item => {
    const matchCat = (activeCat === 'all') || (item.c === activeCat);
    const matchSearch = !searchQuery || 
      item.t.toLowerCase().includes(searchQuery) ||
      item.p.toLowerCase().includes(searchQuery) ||
      item.s.toLowerCase().includes(searchQuery);
    return matchCat && matchSearch;
  });

  document.getElementById('liveCount').innerText = `${filtered.length} / ${issues.length} shown`;

  if(filtered.length === 0){
    main.innerHTML = '';
    noRes.style.display = 'block';
    return;
  }
  noRes.style.display = 'none';

  let html = '';
  categories.forEach(cat => {
    if(activeCat !== 'all' && activeCat !== cat.id) return;

    const catIssues = filtered.filter(i => i.c === cat.id);
    if(catIssues.length === 0) return;

    html += `
    <section class="cat-section" style="--cat-color:${cat.color}">
      <div class="cat-head">
        <span class="range">${cat.range}</span>
        <h2>${cat.name}</h2>
        <span class
